
name: Integracion continua

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-readme:
    name: Actualizar README
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Registrar nueva feature
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          MENSAJE=$(git log -1 --pretty=%s)
          echo "Ultimo commit: $MENSAJE"

          if [[ "$MENSAJE" =~ ^Merge\ pull\ request\ \#[0-9]+\ from\ [^/]+/(feature/.+)$ ]]; then
            RAMA="${BASH_REMATCH[1]}"
          else
            echo "No se ha identificado una fusion de feature."
            exit 0
          fi

          LINEA="Añadida feature: $RAMA"

          if grep -Fxq "$LINEA" README.md; then
            echo "Feature ya registrada."
            exit 0
          fi

          git checkout -b "automation/readme-ci-${GITHUB_RUN_ID}"
          echo "$LINEA" >> README.md

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md
          git commit -m "docs: registrar $RAMA"
          git push origin HEAD

          gh pr create \
            --base develop \
            --head "automation/readme-ci-${GITHUB_RUN_ID}" \
            --title "docs: registrar $RAMA" \
            --body "Actualizacion automatica del README generada por CI."

  validate-dev:
    name: Validar token de desarrollo
    needs: update-readme
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Comprobar token DEV
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if [ "$DEV_TOKEN" = "$LOCAL_DEV_TOKEN" ]; then
            echo "Token de desarrollo correcto"
          else
            echo "ERROR: los tokens de desarrollo no coinciden"
            exit 1
          fi
