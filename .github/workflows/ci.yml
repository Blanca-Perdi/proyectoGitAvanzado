
name: Integracion continua

on:
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    name: Actualizar README
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Registrar nueva feature
        if: github.event_name == 'push'
        shell: bash
        run: |
          echo "Identificando la funcionalidad incorporada..."
          MENSAJE=$(git log -1 --pretty=%s)
          echo "Ultimo commit: $MENSAJE"

          if [[ "$MENSAJE" =~ ^Merge\ pull\ request\ #[0-9]+\ from\ [^/]+/(.+)$ ]]; then
            RAMA="${BASH_REMATCH[1]}"
            echo "Rama identificada: $RAMA"

            if [[ "$RAMA" == feature/* ]]; then
              LINEA="Añadida feature: $RAMA"

              if [ ! -f README.md ]; then
                touch README.md
              fi

              if ! grep -Fxq "$LINEA" README.md; then
                echo "$LINEA" >> README.md
                echo "Funcionalidad registrada en README.md"
              else
                echo "Esta funcionalidad ya estaba registrada."
              fi
            else
              echo "La rama incorporada no es una feature."
            fi
          else
            echo "No se ha identificado una rama de feature en este commit."
          fi

          if [ -n "$(git status --porcelain -- README.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: registrar nueva feature"
            git push origin HEAD:develop
          else
            echo "No hay cambios en README.md que guardar."
          fi

  validate-dev:
    name: Validar token de desarrollo
    needs: update-readme
    runs-on: [self-hosted, macOS, ARM64]

    steps:
      - name: Comprobar token DEV
        env:
          DEV_TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if [ "$DEV_TOKEN" = "$LOCAL_DEV_TOKEN" ]; then
            echo "Token de desarrollo correcto"
          else
            echo "ERROR: los tokens de desarrollo no coinciden"
            exit 1
          fi
